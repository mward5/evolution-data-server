name: Build release packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish as (defaults to the pushed tag)'
        required: false

permissions:
  contents: read

# The tag the release is published under. A tag push sets github.ref_name to
# the tag, but a manual re-run sets it to the branch the workflow was
# dispatched from, which is how the triplewrap6 packages came to be published
# as "...-triple-wrap-debs.tar.gz". Resolve it once here, the same way the
# publish job always has, so the artifact names agree with the release.
env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build-deb:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: debian-packaging

      - name: Install build tooling and Build-Depends
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends dpkg-dev build-essential fakeroot equivs devscripts
          apt-get build-dep -y .

      - name: Build .deb
        run: dpkg-buildpackage -us -uc -b

      - name: Collect artifacts
        run: |
          mkdir -p dist debug
          mv ../*.deb dist/
          # Debug symbols are a large fraction of the bytes and are rarely
          # wanted; keep them off the release page. They stay reachable as a
          # workflow artifact for as long as retention allows.
          mv dist/*dbgsym*.deb debug/ 2>/dev/null || true
          # A single archive, so someone on the release web page can take the
          # whole set in one download instead of clicking each package. It is
          # attested alongside the individual packages below, so either form
          # can be verified with `gh attestation verify`.
          ( cd dist && tar -czf "../${BUNDLE}" *.deb && mv "../${BUNDLE}" . )
          ls -l dist debug
        env:
          BUNDLE: ${{ github.event.repository.name }}-${{ env.RELEASE_TAG }}-debs.tar.gz

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.deb
            dist/*.tar.gz

      # One directory per artifact. upload-artifact roots an artifact at the
      # least common ancestor of everything it matches, so listing paths from
      # both dist/ and debug/ pushed those directory names into the artifact,
      # and the release step then looked for dist/*.deb inside dist/dist/.
      - uses: actions/upload-artifact@v4
        with:
          name: deb-packages-${{ env.RELEASE_TAG }}
          path: dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: deb-debug-symbols-${{ env.RELEASE_TAG }}
          path: debug/*
          if-no-files-found: ignore

  build-rpm:
    runs-on: ubuntu-latest
    container: fedora:44
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fedora-packaging

      - name: Install build tooling and BuildRequires
        run: |
          dnf install -y rpm-build rpmdevtools 'dnf-command(builddep)' curl
          rpmdev-setuptree
          dnf builddep -y ./evolution-data-server.spec

      - name: Fetch upstream source tarball
        run: |
          NAME=$(awk -F': *' '/^Name:/{print $2; exit}' evolution-data-server.spec)
          VERSION=$(awk -F': *' '/^Version:/{print $2; exit}' evolution-data-server.spec)
          MAJMIN=$(echo "$VERSION" | cut -d. -f1,2)
          curl -fL -o "$HOME/rpmbuild/SOURCES/${NAME}-${VERSION}.tar.xz" \
            "https://download.gnome.org/sources/${NAME}/${MAJMIN}/${NAME}-${VERSION}.tar.xz"

      - name: Stage patches and spec
        run: |
          cp -v *.patch "$HOME/rpmbuild/SOURCES/" 2>/dev/null || true
          cp -v evolution-data-server.spec "$HOME/rpmbuild/SPECS/"

      - name: Build .rpm
        run: rpmbuild --define "_topdir $HOME/rpmbuild" -bb "$HOME/rpmbuild/SPECS/evolution-data-server.spec"

      - name: Collect artifacts
        run: |
          mkdir -p dist debug
          find "$HOME/rpmbuild/RPMS" -name '*.rpm' -exec cp -v {} dist/ \;
          # Same as the Debian job: debuginfo and debugsource are the bulk of
          # the bytes and stay as a workflow artifact rather than on the
          # release page.
          mv dist/*debuginfo*.rpm dist/*debugsource*.rpm debug/ 2>/dev/null || true
          ( cd dist && tar -czf "../${BUNDLE}" *.rpm && mv "../${BUNDLE}" . )
          ls -l dist debug
        env:
          BUNDLE: ${{ github.event.repository.name }}-${{ env.RELEASE_TAG }}-rpms.tar.gz

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.rpm
            dist/*.tar.gz

      # One directory per artifact. upload-artifact roots an artifact at the
      # least common ancestor of everything it matches, so listing paths from
      # both dist/ and debug/ pushed those directory names into the artifact,
      # and the release step then looked for dist/*.deb inside dist/dist/.
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-packages-${{ env.RELEASE_TAG }}
          path: dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: rpm-debug-symbols-${{ env.RELEASE_TAG }}
          path: debug/*
          if-no-files-found: ignore

  publish-release:
    needs: [build-deb, build-rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only the package artifacts; the debug-symbol ones are deliberately not
      # published, and merge-multiple would otherwise flatten them in here.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: '*-packages-*'
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            dist/*.tar.gz dist/*.deb dist/*.rpm
